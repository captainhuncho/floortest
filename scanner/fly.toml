# FALLBACK ONLY: the scanner runs on Cloudflare Containers (cloudflare/). Use this only if Cloudflare can't keep up, after
# the legal step in the README's Fallback section. Fly.io (London): `fly launch --no-deploy --copy-config`, secrets, `fly deploy`.
app = "floortest-scanner"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "300s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "2gb"
  cpus = 1
