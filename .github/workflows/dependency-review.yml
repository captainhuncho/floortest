# Dependency review: on every pull request, GitHub compares package-lock.json before and after and fails the check
# if the change adds a package version with a known high or critical advisory. It doesn't scan what's already
# installed; `npm audit --omit=dev` before each push covers that.
# The repository is private, so this needs GitHub Code Security switched on (owner's setting); without it the run
# fails with "not supported". Actions are pinned to full commit SHAs; the tag is in the comment beside each one.
name: Dependency review
on:
  pull_request:
    branches: [main, mobile-next]
permissions: {}
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
