# Free uptime check: every 30 minutes, GitHub pings the live site. If it's down, this run fails and
# GitHub emails the repository owner. (30 minutes keeps it inside GitHub's free minutes for private repos.)
name: Uptime
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Home page answers
        run: curl -fsS --max-time 20 --retry 2 --retry-delay 10 -o /dev/null -w "home %{http_code} in %{time_total}s\n" https://floortest.imullar.com/
      - name: Health check (database)
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 10 https://floortest.imullar.com/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
