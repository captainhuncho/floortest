# Free uptime check: every 30 minutes, GitHub pings the live site. If it's down, this run fails and
# GitHub emails the repository owner. (30 minutes keeps it inside GitHub's free minutes for private repos.)
name: Uptime
on:
  schedule:
    - cron: "*/30 * * * *"
    # Once a day, also wake the virus scanner and check ClamAV itself (below).
    - cron: "17 6 * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Home page answers
        run: curl -fsS --max-time 20 --retry 2 --retry-delay 10 -o /dev/null -w "home %{http_code} in %{time_total}s\n" https://floortest.app/
      - name: Health check (database)
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 10 https://floortest.app/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
      # The full health check: scheduled jobs (late or failed, the email queue included), storage, the scanner's status
      # and uploads waiting for their virus check. It needs the cron secret, sent only in a header and never printed; the
      # answer holds no secrets. It doesn't wake the scanner (health asks /status first). Until the owner adds the
      # CRON_SECRET repository secret it's skipped with a notice, so nothing fails before then.
      - name: Health check (jobs, storage, scanner, held uploads)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "::notice::CRON_SECRET isn't set on GitHub, so the full health check was skipped."; exit 0; fi
          body=$(curl -sS --max-time 30 --retry 2 --retry-delay 10 -H "Authorization: Bearer $CRON_SECRET" https://floortest.app/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
      # The virus scanner (scanner/, Cloudflare Containers, one instance): uploads are refused while it's down, and the
      # app's own health check only covers it with the cron secret, so check it here too. It sleeps after 10 idle
      # minutes and an upload wakes it (owner, 26 Oct, to cut its cost), so the half-hourly check asks /status, which
      # answers from the Worker without waking the container: a ping every 30 minutes would keep it awake a third of the
      # time. Trade-off: between the daily checks, a broken image or signature load only shows on the next upload
      # (refused and logged as an incident, never let through unscanned).
      - name: Virus scanner reachable (without waking it)
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 10 https://floortest-scanner.maxwelladjavon.workers.dev/status)
          echo "$body"
          echo "$body" | grep -q '"worker":true'
      # Once a day (and on a manual run): wake it and wait for ClamAV, up to about 2 minutes for a cold start. /health
      # needs the scanner's secret (owner, 28 Oct: the repository is public, so an open /health let anyone keep the
      # container awake and billed). Until the owner adds SCAN_SECRET as a repository secret, this step is skipped with
      # a notice.
      - name: Virus scanner wakes and ClamAV answers (daily)
        if: github.event.schedule == '17 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          SCAN_SECRET: ${{ secrets.SCAN_SECRET }}
        run: |
          if [ -z "$SCAN_SECRET" ]; then echo "::notice::SCAN_SECRET isn't set on GitHub, so the daily scanner wake-up was skipped."; exit 0; fi
          body=$(curl -fsS --max-time 100 --retry 3 --retry-delay 10 --retry-all-errors -H "Authorization: Bearer $SCAN_SECRET" https://floortest-scanner.maxwelladjavon.workers.dev/health)
          echo "$body"
          echo "$body" | grep -q '"clamd":true'
