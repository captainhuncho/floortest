# Free uptime check: every 30 minutes, GitHub pings the live site. If it's down, this run fails and
# GitHub emails the repository owner. (30 minutes keeps it inside GitHub's free minutes for private repos.)
name: Uptime
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Home page answers
        run: curl -fsS --max-time 20 --retry 2 --retry-delay 10 -o /dev/null -w "home %{http_code} in %{time_total}s\n" https://floortest.app/
      - name: Health check (database)
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 10 https://floortest.app/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
      # The virus scanner (scanner/, Cloudflare Containers, one instance): uploads are refused while it's down, and the
      # app's own health check only covers it with the cron secret, so check its public /health here too.
      - name: Virus scanner answers
        run: |
          body=$(curl -fsS --max-time 20 --retry 2 --retry-delay 10 https://floortest-scanner.maxwelladjavon.workers.dev/health)
          echo "$body"
          echo "$body" | grep -q '"clamd":true'
